listen_addresses = '*'

wal_level = logical
max_wal_senders = 4
max_replication_slots = 4

# The catalog is shared by the PeerDB services and by every test package; the
# e2e and connector tests each open their own connections in parallel, scaled
# by the host's core count, so the default of 100 runs out on large CI runners.
# Matches the ancillary Postgres sources (local_provision_scripts/postgres.sh).
max_connections = 2048
