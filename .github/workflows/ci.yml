name: Catalog Migrations

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]
    paths: [flow/db/**, .github/workflows/ci.yml]

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest]
        postgres-version: [14, 15, 16, 17, 18]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    services:
      catalog_peer:
        image: postgres:${{ matrix.postgres-version }}-alpine
        ports:
          - 7132:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: generate or hydrate protos
        uses: ./.github/actions/genprotos

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: flow/go.sum

      - name: run catalog migrations
        run: go run . migrate
        working-directory: ./flow
        env:
          PEERDB_CATALOG_HOST: localhost
          PEERDB_CATALOG_PORT: 7132
          PEERDB_CATALOG_DATABASE: postgres
          PEERDB_CATALOG_USER: postgres
          PEERDB_CATALOG_PASSWORD: postgres
