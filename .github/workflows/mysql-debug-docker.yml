name: MySQL Debug Docker Image

on:
  workflow_dispatch:
    inputs:
      mysql_version:
        description: MySQL version tag to build.
        required: true
        default: "8.0.46"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mysql-debug-docker.yml"
      - "flow/e2e/test_data/mysql-debug/docker-bake.hcl"
      - "flow/e2e/test_data/mysql-debug/Dockerfile"
