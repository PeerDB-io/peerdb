name: Flow build and test

on:
  pull_request:
    branches: [main]
    # Ignore changes to files that don't require builds or validations.
    # If more complex build avoidance is required, or for other events than pull_request, push, and pull_request_target,
    # replace this with a gate step in the job.
    # TODO: Re-enable build avoidance once we figure out how not to block the merge on the flow checks.
    #paths-ignore: &ignore_paths
    #    - '.claude/**'
    #    - 'README.md'
  push:
    branches: [main]
    #paths-ignore: *ignore_paths
  pull_request_target:
    branches: [main]
    #paths-ignore: *ignore_paths

permissions:
  # id-token: needed by tilt-flow.yml's OIDC AWS-credentials step (RDS IAM
  # auth tests); a reusable workflow cannot exceed its caller's grant.
  id-token: write
  contents: read

jobs:
  # Jobs that call a reusable workflow cannot set `environment:`, so the
  # manual-approval gate for external contributions (pull_request_target from
  # forks) lives in this job; flow_test only runs once it passes.
  gate:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) ||
      github.event_name == 'push'
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'external-contributor' || null }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve run
        run: echo "Run approved for ${{ github.event_name }}."

  # Packages not owned by a source run once, against the core stack/catalog.
  # E2E entry points must have an owner in flow/test-jobs.yml.
  unit_tests:
    needs: [gate]
    uses: ./.github/workflows/tilt-flow.yml
    with:
      test_group: unit
      ancillary_services: ''
      checkout_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      run_label: unit
    secrets: inherit

  # One job per (source, ClickHouse version). test-jobs.yml selects packages
  # and E2E suites; ancillary_services selects the infrastructure they need.
  flow_test:
    # e.g. "(mysql: mysql-gtid + maria-11, ch: lts)", "(bigquery, ch: latest)"
    name: "(${{ matrix.source }}${{ matrix.version && format(': {0}', matrix.version) || '' }}${{ matrix.mariadb && format(' + {0}', matrix.mariadb) || '' }}, ch: ${{ matrix.ch }})"
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        # Postgres also owns destination packages, including ClickHouse.
        source: [postgres, mysql, mongodb, cockroachdb, bigquery]
        # The source's own version for each (source, ch) cell. Each row only
        # adds keys to the cell it matches, so a source with fewer or more
        # versions than ClickHouse releases just lists what it has; cells
        # without a row (bigquery) run with no local version. MySQL rows carry
        # the MySQL flavor as version and a MariaDB release alongside, since
        # both share the mysql job.
        include:
          - {source: postgres, version: '16', ch: lts}
          - {source: postgres, version: '17', ch: stable}
          - {source: postgres, version: '18', ch: latest}
          - {source: mysql, version: mysql-gtid, mariadb: maria-11, ch: lts}
          - {source: mysql, version: mysql-pos,  mariadb: maria-12, ch: stable}
          - {source: mysql, version: mysql-gtid, mariadb: maria-13, ch: latest}
          - {source: mongodb, version: '6.0', ch: lts}
          - {source: mongodb, version: '7.0', ch: stable}
          - {source: mongodb, version: '8.0', ch: latest}
          - {source: cockroachdb, version: v24, ch: lts}
          - {source: cockroachdb, version: v25, ch: stable}
          - {source: cockroachdb, version: v26, ch: latest}
        # Container images per version key. Wrapped in a single-item list
        # because matrix values must be arrays; it stays a single shared value
        # (no extra jobs).
        images:
          - mysql:
              mysql-gtid: mysql:9.5
              mysql-pos: mysql:5.7
            mariadb:
              maria-11: mariadb:lts-ubi9
              maria-12: mariadb:12-ubi
              maria-13: mariadb:13.0-ubi-rc
            clickhouse:
              lts: clickhouse/clickhouse-server:25.8.28.1
              stable: clickhouse/clickhouse-server:26.3.16.16
              latest: clickhouse/clickhouse-server:latest
            # Pinned versions only: unlike the ClickHouse destination, source
            # connectors are not tested against a floating latest tag.
            cockroachdb:
              v24: cockroachdb/cockroach:v24.1.30
              v25: cockroachdb/cockroach:v25.4.14
              v26: cockroachdb/cockroach:v26.2.5
        # ClickHouse destination release every source is checked against.
        ch: [lts, stable, latest]
    uses: ./.github/workflows/tilt-flow.yml
    with:
      test_group: ${{ matrix.source }}
      # Services Tilt enables for this run: the shared set on the first line,
      # then the source's own. otel-collector goes first: listing it turns on
      # the flow services' OTel export (ENABLE_OTEL_METRICS in tilt-flow.yml),
      # and they panic on export failure, so it must be up before they start.
      # postgres2 backs the pg_dump schema tests; mariadb rides with the MySQL
      # flavor since both share the mysql job.
      ancillary_services: >-
        otel-collector clickhouse clickhouse-keeper clickhouse-02 toxiproxy openssh
        ${{ matrix.source == 'postgres' && 'postgres postgres2' || '' }}
        ${{ matrix.source == 'mysql' && format('{0} mariadb', matrix.version) || '' }}
        ${{ matrix.source == 'mongodb' && 'mongodb' || '' }}
        ${{ matrix.source == 'cockroachdb' && 'cockroachdb' || '' }}
      checkout_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      # e.g. "postgres-16-ch-lts", "mysql-mysql-gtid-maria-11-ch-lts", "bigquery-ch-lts";
      # becomes the compatibility_matrix_id of the ingested test results.
      run_label: ${{ matrix.source }}${{ matrix.version && format('-{0}', matrix.version) || '' }}${{ matrix.mariadb && format('-{0}', matrix.mariadb) || '' }}-ch-${{ matrix.ch }}
      # Images only for the services this job starts; the rest stay empty and
      # fall back to generate-test-environment.sh's defaults (unused anyway).
      postgres_image: ${{ matrix.source == 'postgres' && format('imresamu/postgis:{0}-3.5-alpine', matrix.version) || '' }}
      mysql_gtid_image: ${{ matrix.source == 'mysql' && matrix.version == 'mysql-gtid' && matrix.images.mysql['mysql-gtid'] || '' }}
      mysql_pos_image: ${{ matrix.source == 'mysql' && matrix.version == 'mysql-pos' && matrix.images.mysql['mysql-pos'] || '' }}
      mariadb_image: ${{ matrix.source == 'mysql' && matrix.images.mariadb[matrix.mariadb] || '' }}
      mongodb_image: ${{ matrix.source == 'mongodb' && format('mongo:{0}', matrix.version) || '' }}
      clickhouse_image: ${{ matrix.images.clickhouse[matrix.ch] }}
      cockroachdb_image: ${{ matrix.source == 'cockroachdb' && matrix.images.cockroachdb[matrix.version] || '' }}
      # Point the tests at this job's MySQL flavors; overrides what they load
      # from .env. The ports must match CI_MYSQL_GTID_PORT/CI_MYSQL_POS_PORT in
      # .env.example (the CI .env is seeded from it). Empty on other sources,
      # whose jobs run no MySQL tests.
      test_env: |
        CI_MYSQL_VERSION=${{ matrix.source == 'mysql' && matrix.version || '' }}
        CI_MYSQL_PORT=${{ matrix.version == 'mysql-pos' && '3307' || '3306' }}
        CI_MARIADB_VERSION=${{ matrix.mariadb }}
        FLOW_TESTS_RDS_IAM_AUTH_SKIP=false
    secrets: inherit

  # Single summary status once every parallel job above has finished. It fails
  # if any of them did not succeed, so branch protection can require this one
  # check instead of every matrix cell. `always()` makes it run after failures
  # too; the gate check keeps it from failing runs where nothing was meant to
  # run (e.g. fork PRs on the plain pull_request event).
  flow_tests_passed:
    name: All tests flows succeeded
    needs: [gate, unit_tests, flow_test]
    if: always() && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "All tests flows succeeded."
          else
            echo "::error::At least one flow test job did not succeed."
            exit 1
          fi
