name: Flow build and test

on:
  pull_request:
    branches: [main]
    # Ignore changes to files that don't require builds or validations.
    # If more complex build avoidance is required, or for other events than pull_request, push, and pull_request_target,
    # replace this with a gate step in the job.
    # TODO: Re-enable build avoidance once we figure out how not to block the merge on the flow checks.
    #paths-ignore: &ignore_paths
    #    - '.claude/**'
    #    - 'README.md'
  push:
    branches: [main]
    #paths-ignore: *ignore_paths
  pull_request_target:
    branches: [main]
    #paths-ignore: *ignore_paths

permissions:
  # id-token: needed by tilt-flow.yml's OIDC AWS-credentials step (RDS IAM
  # auth tests); a reusable workflow cannot exceed its caller's grant.
  id-token: write
  contents: read
  # actions: read lets tilt-flow.yml resolve the go_build_cache artifact's
  # download URL through the REST API and fetch it with parallel ranges.
  actions: read

jobs:
  # Jobs that call a reusable workflow cannot set `environment:`, so the
  # manual-approval gate for external contributions (pull_request_target from
  # forks) lives in this job; flow_test only runs once it passes.
  gate:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) ||
      github.event_name == 'push'
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'external-contributor' || null }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve run
        run: echo "Run approved for ${{ github.event_name }}."

  unit_tests:
    name: Unit tests (no services)
    needs: [gate]
    runs-on: ubuntu-latest-64-core
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
      # Samples CPU/memory/disk/network on the runner for the whole job and
      # writes a report to the job summary; the post step runs even on failure.
      # Must come after checkout: the collector keeps its data file in the
      # workspace, which checkout wipes.
      - name: Runner telemetry
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1.7.4
        with:
          upload-artifacts: true
          artifact-name: runner-telemetry-unit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev retry
      - run: ./generate-protos.sh
      - run: cp .env.example .env
      - run: go install gotest.tools/gotestsum@latest
      - run: mkdir -p logs
      - name: Unit tests (flow)
        working-directory: ./flow
        run: |
          gotestsum --format standard-quiet --no-color --junitfile ../logs/unit-test-results.xml -- \
            -p 32 ./... -timeout 600s
      - name: Unit tests (pkg)
        working-directory: ./flow/pkg
        run: |
          gotestsum --format standard-quiet --no-color --junitfile ../../logs/unit-pkg-test-results.xml -- \
            -p 32 ./... -timeout 300s
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flow-unit-test-results
          path: logs/
          retention-days: 30
      - name: Ingest unit test results
        if: (success() || failure()) && hashFiles('logs/unit-test-results.xml') != ''
        uses: ./.github/actions/ingest-test-results
        with:
          combination-id: unit
          test-results-file: logs/unit-test-results.xml
          o11y-api-key-id: ${{ secrets.CI_O11Y_TARGET_API_KEY_ID }}
          o11y-api-key-secret: ${{ secrets.CI_O11Y_TARGET_API_KEY_SECRET }}
          o11y-query-endpoint: ${{ secrets.CI_O11Y_TARGET_QUERY_ENDPOINT }}
      - name: Ingest pkg unit test results
        if: (success() || failure()) && hashFiles('logs/unit-pkg-test-results.xml') != ''
        uses: ./.github/actions/ingest-test-results
        with:
          combination-id: unit-pkg
          test-results-file: logs/unit-pkg-test-results.xml
          o11y-api-key-id: ${{ secrets.CI_O11Y_TARGET_API_KEY_ID }}
          o11y-api-key-secret: ${{ secrets.CI_O11Y_TARGET_API_KEY_SECRET }}
          o11y-query-endpoint: ${{ secrets.CI_O11Y_TARGET_QUERY_ENDPOINT }}

  test_selection_coverage:
    name: Test selection coverage
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: ./generate-protos.sh
      - run: bash .github/scripts/check-flow-test-selection.sh

  # Compiles every flow test package once and publishes the resulting Go build
  # cache entries as a run artifact, so the flow_test matrix jobs don't each
  # recompile the same code. setup-go's own cache is keyed on go.sum only, so
  # it holds the dependencies but never the current commit's packages.
  #
  # An artifact (not actions/cache) on purpose: it is scoped to this run, so
  # code from a fork PR under pull_request_target cannot seed a cache that
  # later runs on main would restore.
  go_build_cache:
    name: Go build cache
    needs: [gate]
    # Not 64 cores: unit_tests already takes the one 64-core runner that is
    # usually ready, and a second one tends to queue ~2 minutes.
    runs-on: ubuntu-latest-32-cores
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
      # Must come after checkout: the collector keeps its data file in the
      # workspace, which checkout wipes.
      - name: Runner telemetry
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1.7.4
        with:
          upload-artifacts: true
          artifact-name: runner-telemetry-go-build-cache
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      # Same generator Tilt's proto-gen resource runs in the matrix jobs; the
      # generated sources must match for the cached packages to be reused.
      - run: ./generate-protos.sh
      # Record what setup-go restored, so only entries this job adds are
      # shipped: the matrix jobs restore that same setup-go cache themselves.
      - name: Snapshot restored Go build cache
        run: |
          set -euo pipefail
          gocache="$(go env GOCACHE)"
          mkdir -p "$gocache"
          (cd "$gocache" && find . -type f | LC_ALL=C sort) > "$RUNNER_TEMP/gocache-before.txt"
      # Run the matrix jobs' own selection script over every package: same
      # commands and flags, so it produces exactly the cache entries their
      # Select tests and Run tests steps look up. Listing tests needs no
      # services.
      - name: Compile all flow tests
        env:
          TEST_PACKAGES: ./...
          PKG_TEST_PACKAGES: ./...
        run: bash .github/scripts/select-flow-tests.sh
      - name: Pack new Go build cache entries
        run: |
          set -euo pipefail
          cd "$(go env GOCACHE)"
          find . -type f | LC_ALL=C sort > "$RUNNER_TEMP/gocache-after.txt"
          LC_ALL=C comm -13 "$RUNNER_TEMP/gocache-before.txt" "$RUNNER_TEMP/gocache-after.txt" \
            > "$RUNNER_TEMP/gocache-new.txt"
          echo "new cache entries: $(wc -l < "$RUNNER_TEMP/gocache-new.txt")"
          tar -cf "$RUNNER_TEMP/go-build-cache.tar.zst" \
            --use-compress-program 'zstd -T0 -3' \
            --files-from "$RUNNER_TEMP/gocache-new.txt"
          ls -lh "$RUNNER_TEMP/go-build-cache.tar.zst"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/go-build-cache.tar.zst
          if-no-files-found: error
          # Upload the zstd tarball as-is (the artifact is named after the
          # file), so consumers can range-fetch the raw blob.
          archive: false
          compression-level: 0
          # Only this run's matrix jobs read it.
          retention-days: 1
          # Lets a re-run of this job replace the earlier attempt's artifact.
          overwrite: true

  # Builds the flow-api, flow-worker and flow-snapshot-worker images once and
  # publishes them as a run artifact, so the flow_test matrix jobs load them
  # instead of each compiling peer-flow inside Docker on startup. Same
  # Dockerfile targets and build args as the Tiltfile's docker_build calls.
  # An artifact rather than a registry or cache, for the same reason as
  # go_build_cache.
  flow_images:
    name: Flow images
    needs: [gate]
    runs-on: ubuntu-latest-32-cores
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
      # Must come after checkout: the collector keeps its data file in the
      # workspace, which checkout wipes.
      - name: Runner telemetry
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1.7.4
        with:
          upload-artifacts: true
          artifact-name: runner-telemetry-flow-images
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      # The images embed flow/generated, which Tilt's proto-gen produces
      # before its image builds in the matrix jobs.
      - run: ./generate-protos.sh
      - name: Build flow images
        run: |
          set -euo pipefail
          for target in flow-api flow-worker flow-snapshot-worker; do
            args=(--build-arg DEBUG_BUILD=)
            if [ "$target" = flow-api ]; then
              args+=(--build-arg PEERDB_VERSION_SHA_SHORT=unknown)
            fi
            docker build --file stacks/flow.Dockerfile --target "$target" --tag "$target" "${args[@]}" .
          done
      - name: Save flow images
        run: |
          set -euo pipefail
          docker save flow-api flow-worker flow-snapshot-worker |
            zstd -T0 -3 > "$RUNNER_TEMP/flow-images.tar.zst"
          ls -lh "$RUNNER_TEMP/flow-images.tar.zst"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/flow-images.tar.zst
          if-no-files-found: error
          # Upload the zstd tarball as-is (the artifact is named after the
          # file), so consumers can range-fetch the raw blob.
          archive: false
          compression-level: 0
          retention-days: 1
          overwrite: true

  flow_test:
    name: ${{ matrix.target.label }}
    # Validate the common code before allocating runners for every permutation.
    needs: [gate, unit_tests, test_selection_coverage, go_build_cache, flow_images]
    strategy:
      fail-fast: false
      matrix:
        target:
          - {job: postgres_clickhouse,    version: '16',          ch: lts,    label: postgres-16_ch-lts}
          - {job: postgres_clickhouse,    version: '17',          ch: stable, label: postgres-17_ch-stable}
          - {job: postgres_clickhouse,    version: '18',          ch: latest, label: postgres-18_ch-latest}
          - {job: postgres_other,         version: '16',          label: postgres-16_other}
          - {job: postgres_other,         version: '17',          label: postgres-17_other}
          - {job: postgres_other,         version: '18',          label: postgres-18_other}
          - {job: mysql_clickhouse,       version: mysql-gtid,    ch: lts,    label: mysql-gtid_ch-lts}
          - {job: mysql_clickhouse,       version: mysql-pos,     ch: stable, label: mysql-pos_ch-stable}
          - {job: mysql_clickhouse,       version: mysql-gtid,    ch: latest, label: mysql-gtid_ch-latest}
          - {job: mysql_clickhouse,       version: maria-11,      ch: lts,    label: maria-11_ch-lts}
          - {job: mysql_clickhouse,       version: maria-12,      ch: stable, label: maria-12_ch-stable}
          - {job: mysql_clickhouse,       version: maria-13,      ch: latest, label: maria-13_ch-latest}
          - {job: mongo_clickhouse,       version: '6.0',         ch: lts,    label: mongo-6_ch-lts}
          - {job: mongo_clickhouse,       version: '7.0',         ch: stable, label: mongo-7_ch-stable}
          - {job: mongo_clickhouse,       version: '8.2.12',      ch: latest, label: mongo-8_ch-latest}
          - {job: cockroachdb_clickhouse, version: v24,           ch: lts,    label: cockroachdb-v24_ch-lts}
          - {job: cockroachdb_clickhouse, version: v25,           ch: stable, label: cockroachdb-v25_ch-stable}
          - {job: cockroachdb_clickhouse, version: v26,           ch: latest, label: cockroachdb-v26_ch-latest}
          - {job: bigquery_clickhouse,    ch: lts,    label: bigquery_ch-lts}
          - {job: bigquery_clickhouse,    ch: stable, label: bigquery_ch-stable}
          - {job: bigquery_clickhouse,    ch: latest, label: bigquery_ch-latest}
        jobs:
          - postgres_clickhouse:
              packages: >-
                ./e2e/postgres_clickhouse/...
                ./e2e/postgres_postgres/...
                ./e2e/switchboard_postgres/...
                ./alerting/...
                ./connectors/postgres/...
                ./connectors/clickhouse/...
                ./connectors/utils/...
                ./connectors/external_metadata/...
                ./db/...
              pkg: ./clickhouse/...
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 postgres postgres2
            postgres_other:
              packages: ./e2e/postgres_other/...
              pkg: ''
              services: otel-collector toxiproxy openssh postgres
            mysql_clickhouse:
              packages: >-
                ./e2e/mysql_clickhouse/...
                ./e2e/switchboard_mysql/...
                ./connectors/mysql/...
              pkg: ./mysql/...
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02
            mongo_clickhouse:
              packages: >-
                ./e2e/mongo_clickhouse/...
                ./e2e/switchboard_mongo/...
                ./connectors/mongo/...
              pkg: ./mongo/...
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 mongodb
            cockroachdb_clickhouse:
              packages: ./e2e/cockroachdb_clickhouse/...
              pkg: ''
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 cockroachdb
            bigquery_clickhouse:
              packages: >-
                ./e2e/bigquery_clickhouse/...
                ./connectors/bigquery/...
              pkg: ''
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02
        images:
          - mysql:
              mysql-gtid: mysql:9.5
              mysql-pos: mysql:5.7
            mariadb:
              maria-11: mariadb:lts-ubi9
              maria-12: mariadb:12-ubi
              maria-13: mariadb:13.0-ubi-rc
            clickhouse:
              lts: clickhouse/clickhouse-server:26.8
              stable: clickhouse/clickhouse-server:26.9
              latest: clickhouse/clickhouse-server:latest
            cockroachdb:
              v24: cockroachdb/cockroach:v24.1.30
              v25: cockroachdb/cockroach:v25.4.14
              v26: cockroachdb/cockroach:v26.2.5
    uses: ./.github/workflows/tilt-flow.yml
    with:
      checkout_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      run_label: ${{ matrix.target.label }}
      go_build_cache_artifact_id: ${{ needs.go_build_cache.outputs.artifact-id }}
      go_build_cache_artifact_digest: ${{ needs.go_build_cache.outputs.artifact-digest }}
      flow_images_artifact_id: ${{ needs.flow_images.outputs.artifact-id }}
      flow_images_artifact_digest: ${{ needs.flow_images.outputs.artifact-digest }}
      test_packages: ${{ matrix.jobs[matrix.target.job].packages }}
      pkg_test_packages: ${{ matrix.jobs[matrix.target.job].pkg }}
      ancillary_services: >-
        ${{ matrix.jobs[matrix.target.job].services }}
        ${{ matrix.target.job == 'mysql_clickhouse' && (startsWith(matrix.target.version, 'maria-') && 'mariadb' || matrix.target.version) || '' }}
      postgres_image: ${{ startsWith(matrix.target.job, 'postgres_') && format('imresamu/postgis:{0}-3.5-alpine', matrix.target.version) || '' }}
      mysql_gtid_image: ${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version == 'mysql-gtid' && matrix.images.mysql['mysql-gtid'] || '' }}
      mysql_pos_image: ${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version == 'mysql-pos' && matrix.images.mysql['mysql-pos'] || '' }}
      mariadb_image: ${{ matrix.target.job == 'mysql_clickhouse' && startsWith(matrix.target.version, 'maria-') && matrix.images.mariadb[matrix.target.version] || '' }}
      mongodb_image: ${{ matrix.target.job == 'mongo_clickhouse' && format('mongo:{0}', matrix.target.version) || '' }}
      clickhouse_image: ${{ matrix.target.ch && matrix.images.clickhouse[matrix.target.ch] || '' }}
      cockroachdb_image: ${{ matrix.target.job == 'cockroachdb_clickhouse' && matrix.images.cockroachdb[matrix.target.version] || '' }}
      test_env: |
        CI_MYSQL_VERSION=${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version || '' }}
        CI_MYSQL_PORT=${{ startsWith(matrix.target.version, 'maria-') && '3308' || matrix.target.version == 'mysql-pos' && '3307' || '3306' }}
        FLOW_TESTS_RDS_IAM_AUTH_SKIP=false
    secrets: inherit

  # pull_request and pull_request_target both trigger this workflow, but only one runs tests.
  # Give the other run a different check name so its skipped tests cannot satisfy the required check.
  # This job must always run because GitHub does not evaluate dynamic names for skipped jobs.
  flow_tests_passed:
    name: ${{ needs.gate.result != 'skipped' && 'All flow test jobs succeeded' || 'Flow tests not run for this event' }}
    needs: [gate, unit_tests, test_selection_coverage, go_build_cache, flow_images, flow_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.gate.result != 'skipped'
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "::error::At least one flow test job did not succeed."; exit 1; }
