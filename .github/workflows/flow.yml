name: Flow build and test

on:
  pull_request:
    branches: [main]
    # Ignore changes to files that don't require builds or validations.
    # If more complex build avoidance is required, or for other events than pull_request, push, and pull_request_target,
    # replace this with a gate step in the job.
    # TODO: Re-enable build avoidance once we figure out how not to block the merge on the flow checks.
    #paths-ignore: &ignore_paths
    #    - '.claude/**'
    #    - 'README.md'
  push:
    branches: [main]
    #paths-ignore: *ignore_paths
  pull_request_target:
    branches: [main]
    #paths-ignore: *ignore_paths

permissions:
  # id-token: needed by tilt-flow.yml's OIDC AWS-credentials step (RDS IAM
  # auth tests); a reusable workflow cannot exceed its caller's grant.
  id-token: write
  contents: read

jobs:
  # Jobs that call a reusable workflow cannot set `environment:`, so the
  # manual-approval gate for external contributions (pull_request_target from
  # forks) lives in this job; flow_test only runs once it passes.
  gate:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) ||
      github.event_name == 'push'
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'external-contributor' || null }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve run
        run: echo "Run approved for ${{ github.event_name }}."

  unit_tests:
    name: Unit tests (no services)
    needs: [gate]
    runs-on: ubuntu-latest-64-core
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev retry
      - run: ./generate-protos.sh
      - run: cp .env.example .env
      - run: go install gotest.tools/gotestsum@latest
      - run: mkdir -p logs
      - name: Unit tests (flow)
        working-directory: ./flow
        run: |
          packages=$(go list ./... | grep -v '/e2e$' | grep -v '/e2e/') || exit 1
          mapfile -t package_array <<< "$packages"
          gotestsum --format standard-quiet --no-color --junitfile ../logs/unit-test-results.xml -- \
            -p 32 "${package_array[@]}" -timeout 600s
      - name: Unit tests (pkg)
        working-directory: ./flow/pkg
        run: |
          gotestsum --format standard-quiet --no-color --junitfile ../../logs/unit-pkg-test-results.xml -- \
            -p 32 ./... -timeout 300s
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flow-unit-test-results
          path: logs/
          retention-days: 30
      - name: Ingest unit test results
        if: (success() || failure()) && hashFiles('logs/unit-test-results.xml') != ''
        uses: ./.github/actions/ingest-test-results
        with:
          combination-id: unit
          test-results-file: logs/unit-test-results.xml
          o11y-api-key-id: ${{ secrets.CI_O11Y_TARGET_API_KEY_ID }}
          o11y-api-key-secret: ${{ secrets.CI_O11Y_TARGET_API_KEY_SECRET }}
          o11y-query-endpoint: ${{ secrets.CI_O11Y_TARGET_QUERY_ENDPOINT }}
      - name: Ingest pkg unit test results
        if: (success() || failure()) && hashFiles('logs/unit-pkg-test-results.xml') != ''
        uses: ./.github/actions/ingest-test-results
        with:
          combination-id: unit-pkg
          test-results-file: logs/unit-pkg-test-results.xml
          o11y-api-key-id: ${{ secrets.CI_O11Y_TARGET_API_KEY_ID }}
          o11y-api-key-secret: ${{ secrets.CI_O11Y_TARGET_API_KEY_SECRET }}
          o11y-query-endpoint: ${{ secrets.CI_O11Y_TARGET_QUERY_ENDPOINT }}

  test_selection_coverage:
    name: Test selection coverage
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: ./generate-protos.sh
      - run: bash .github/scripts/check-flow-test-selection.sh

  flow_test:
    name: ${{ matrix.target.label }}
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        target:
          - {job: postgres_clickhouse,    version: '16',       ch: lts,    label: postgres-16_ch-lts}
          - {job: postgres_clickhouse,    version: '17',       ch: stable, label: postgres-17_ch-stable}
          - {job: postgres_clickhouse,    version: '18',       ch: latest, label: postgres-18_ch-latest}
          - {job: postgres_other,         version: '16',       label: postgres-16_other}
          - {job: postgres_other,         version: '17',       label: postgres-17_other}
          - {job: postgres_other,         version: '18',       label: postgres-18_other}
          - {job: mysql_clickhouse,       version: mysql-gtid, mariadb: maria-11, ch: lts,    label: mysql-gtid-maria-11_ch-lts}
          - {job: mysql_clickhouse,       version: mysql-pos,  mariadb: maria-12, ch: stable, label: mysql-pos-maria-12_ch-stable}
          - {job: mysql_clickhouse,       version: mysql-gtid, mariadb: maria-13, ch: latest, label: mysql-gtid-maria-13_ch-latest}
          - {job: mongo_clickhouse,       version: '6.0',      ch: lts,    label: mongo-6.0_ch-lts}
          - {job: mongo_clickhouse,       version: '7.0',      ch: stable, label: mongo-7.0_ch-stable}
          - {job: mongo_clickhouse,       version: '8.0',      ch: latest, label: mongo-8.0_ch-latest}
          - {job: cockroachdb_clickhouse, version: v24,        ch: lts,    label: cockroachdb-v24_ch-lts}
          - {job: cockroachdb_clickhouse, version: v25,        ch: stable, label: cockroachdb-v25_ch-stable}
          - {job: cockroachdb_clickhouse, version: v26,        ch: latest, label: cockroachdb-v26_ch-latest}
          - {job: bigquery_clickhouse,    ch: lts,    label: bigquery_ch-lts}
          - {job: bigquery_clickhouse,    ch: stable, label: bigquery_ch-stable}
          - {job: bigquery_clickhouse,    ch: latest, label: bigquery_ch-latest}
        jobs:
          - postgres_clickhouse:
              e2e: >-
                ./e2e/postgres_clickhouse/...
                ./e2e/postgres_postgres/...
                ./e2e/switchboard_postgres/...
              integration: >-
                ./alerting/...
                ./connectors/postgres/...
                ./connectors/clickhouse/...
                ./connectors/utils/...
                ./connectors/external_metadata/...
                ./db/...
              pkg: ./clickhouse/...
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 postgres postgres2
            postgres_other:
              e2e: ./e2e/postgres_other/...
              integration: ''
              pkg: ''
              services: otel-collector toxiproxy openssh postgres
            mysql_clickhouse:
              e2e: >-
                ./e2e/mysql_clickhouse/...
                ./e2e/switchboard_mysql/...
              integration: ./connectors/mysql/...
              pkg: ''
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 mariadb
            mongo_clickhouse:
              e2e: >-
                ./e2e/mongo_clickhouse/...
                ./e2e/switchboard_mongo/...
              integration: ./connectors/mongo/...
              pkg: ./mongo/...
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 mongodb
            cockroachdb_clickhouse:
              e2e: ./e2e/cockroachdb_clickhouse/...
              integration: ''
              pkg: ''
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02 cockroachdb
            bigquery_clickhouse:
              e2e: ./e2e/bigquery_clickhouse/...
              integration: ./connectors/bigquery/...
              pkg: ''
              services: otel-collector toxiproxy openssh clickhouse clickhouse-keeper clickhouse-02
        images:
          - mysql:
              mysql-gtid: mysql:9.5
              mysql-pos: mysql:5.7
            mariadb:
              maria-11: mariadb:lts-ubi9
              maria-12: mariadb:12-ubi
              maria-13: mariadb:13.0-ubi-rc
            clickhouse:
              lts: clickhouse/clickhouse-server:25.8.28.1
              stable: clickhouse/clickhouse-server:26.3.16.16
              latest: clickhouse/clickhouse-server:latest
            cockroachdb:
              v24: cockroachdb/cockroach:v24.1.30
              v25: cockroachdb/cockroach:v25.4.14
              v26: cockroachdb/cockroach:v26.2.5
    uses: ./.github/workflows/tilt-flow.yml
    with:
      checkout_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      run_label: ${{ matrix.target.label }}
      e2e_packages: ${{ matrix.jobs[matrix.target.job].e2e }}
      integration_packages: ${{ matrix.jobs[matrix.target.job].integration }}
      pkg_integration_packages: ${{ matrix.jobs[matrix.target.job].pkg }}
      ancillary_services: >-
        ${{ matrix.jobs[matrix.target.job].services }}
        ${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version || '' }}
      postgres_image: ${{ startsWith(matrix.target.job, 'postgres_') && format('imresamu/postgis:{0}-3.5-alpine', matrix.target.version) || '' }}
      mysql_gtid_image: ${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version == 'mysql-gtid' && matrix.images.mysql['mysql-gtid'] || '' }}
      mysql_pos_image: ${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version == 'mysql-pos' && matrix.images.mysql['mysql-pos'] || '' }}
      mariadb_image: ${{ matrix.target.job == 'mysql_clickhouse' && matrix.images.mariadb[matrix.target.mariadb] || '' }}
      mongodb_image: ${{ matrix.target.job == 'mongo_clickhouse' && format('mongo:{0}', matrix.target.version) || '' }}
      clickhouse_image: ${{ matrix.target.ch && matrix.images.clickhouse[matrix.target.ch] || '' }}
      cockroachdb_image: ${{ matrix.target.job == 'cockroachdb_clickhouse' && matrix.images.cockroachdb[matrix.target.version] || '' }}
      test_env: |
        CI_MYSQL_VERSION=${{ matrix.target.job == 'mysql_clickhouse' && matrix.target.version || '' }}
        CI_MYSQL_PORT=${{ matrix.target.version == 'mysql-pos' && '3307' || '3306' }}
        CI_MARIADB_VERSION=${{ matrix.target.mariadb }}
        FLOW_TESTS_RDS_IAM_AUTH_SKIP=false
    secrets: inherit

  flow_tests_passed:
    name: All flow test jobs succeeded
    needs: [gate, unit_tests, test_selection_coverage, flow_test]
    if: always() && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "::error::At least one flow test job did not succeed."; exit 1; }
