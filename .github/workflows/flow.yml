name: Flow build and test

on:
  pull_request:
    branches: [main]
    # Ignore changes to files that don't require builds or validations.
    # If more complex build avoidance is required, or for other events than pull_request, push, and pull_request_target,
    # replace this with a gate step in the job.
    # TODO: Re-enable build avoidance once we figure out how not to block the merge on the flow checks.
    #paths-ignore: &ignore_paths
    #    - '.claude/**'
    #    - 'README.md'
  push:
    branches: [main]
    #paths-ignore: *ignore_paths
  pull_request_target:
    branches: [main]
    #paths-ignore: *ignore_paths

permissions:
  # id-token: needed by tilt-flow.yml's OIDC AWS-credentials step (RDS IAM
  # auth tests); a reusable workflow cannot exceed its caller's grant.
  id-token: write
  contents: read

jobs:
  # Jobs that call a reusable workflow cannot set `environment:`, so the
  # manual-approval gate for external contributions (pull_request_target from
  # forks) lives in this job; flow_test only runs once it passes.
  gate:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) ||
      github.event_name == 'push'
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'external-contributor' || null }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve run
        run: echo "Run approved for ${{ github.event_name }}."

  # Unit tests: everything not gated behind a resource build tag (see
  # CONTRIBUTING.md, "Test selection with build tags"). Runs on the same Tilt
  # stack as the e2e jobs, with no build tags and no ancillary services: the
  # core stack already provides the migrated catalog that dynamic settings
  # lookups (and the goose bootstrap test) need. Runs in parallel with
  # flow_test so the stack start-up does not add to the critical path.
  unit_tests:
    needs: [gate]
    uses: ./.github/workflows/tilt-flow.yml
    with:
      build_tags: ''
      test_matcher: ''
      ancillary_services: ''
      checkout_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      run_label: unit
    secrets: inherit

  # One job per (source, ClickHouse version). The source picks the build tags,
  # which select the e2e/integration test files that compile (see
  # CONTRIBUTING.md, "Test selection with build tags"), and the ancillary
  # services Tilt starts. Every job gets the catalog, the ancillary Postgres
  # (the API suites use it whatever the source) and the ClickHouse destination.
  flow_test:
    # Job name: the source under test (= its build tag) with the version(s)
    # of that source's own resources, then the ClickHouse destination version.
    # e.g. "flow_test (mysql: mysql-gtid + maria-11, ch: lts)".
    name: "flow_test (${{ matrix.source }}${{ matrix.source == 'postgres' && format(': pg{0}', matrix.db-version.pg) || matrix.source == 'mysql' && format(': {0} + {1}', matrix.db-version.mysql, matrix.db-version.mariadb) || matrix.source == 'mongodb' && format(': {0}', matrix.db-version.mongo) || matrix.source == 'cockroachdb' && format(': {0}', matrix.db-version.crdb) || '' }}, ch: ${{ matrix.db-version.ch }})"
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        # Source under test; doubles as the build tag. The postgres jobs also
        # carry the clickhouse tag for the destination-only ClickHouse tests, so
        # those run once per ClickHouse version instead of once per source.
        source: [postgres, mysql, mongodb, cockroachdb, bigquery]
        # Version rows, keyed by the ClickHouse release. Only the versions of
        # the row's source and of ClickHouse matter to a given job; the rest
        # are carried along so the images stay pinned consistently.
        db-version: [
          {pg: 16, mysql: 'mysql-gtid', mariadb: 'maria-11', mongo: '6.0', ch: 'lts', crdb: 'v24'},
          {pg: 17, mysql: 'mysql-pos', mariadb: 'maria-12', mongo: '7.0', ch: 'stable', crdb: 'v25'},
          {pg: 18, mysql: 'mysql-gtid', mariadb: 'maria-13', mongo: '8.0', ch: 'latest', crdb: 'v26'},
        ]
        # Per-version container settings.
        # Wrapped in a single-item list because matrix values must be arrays; it stays
        # a single shared value (no extra jobs).
        version-configs:
          - mysql:
              mysql-gtid: mysql:9.5
              mysql-pos: mysql:5.7
            mariadb:
              maria-11: mariadb:lts-ubi9
              maria-12: mariadb:12-ubi
              maria-13: mariadb:13.0-ubi-rc
            clickhouse:
              lts: clickhouse/clickhouse-server:25.8.28.1
              stable: clickhouse/clickhouse-server:26.3.16.16
              latest: clickhouse/clickhouse-server:latest
            # Pinned versions only: unlike the ClickHouse destination, source
            # connectors are not tested against a floating latest tag.
            cockroachdb:
              v24: cockroachdb/cockroach:v24.1.30
              v25: cockroachdb/cockroach:v25.4.14
              v26: cockroachdb/cockroach:v26.2.5
    uses: ./.github/workflows/tilt-flow.yml
    with:
      build_tags: ${{ matrix.source == 'postgres' && 'postgres clickhouse' || matrix.source }}
      # Empty matcher: the build tags already select the tests.
      test_matcher: ''
      # Services Tilt enables for this run: the shared set on the first line,
      # then the source's own. otel-collector goes first: listing it turns on
      # the flow services' OTel export (ENABLE_OTEL_METRICS in tilt-flow.yml),
      # and they panic on export failure, so it must be up before they start.
      # postgres2 backs the pg_dump schema tests; mariadb rides with the MySQL
      # flavor since both share the mysql tag.
      ancillary_services: >-
        otel-collector postgres clickhouse clickhouse-keeper clickhouse-02 toxiproxy openssh
        ${{ matrix.source == 'postgres' && 'postgres2' || '' }}
        ${{ matrix.source == 'mysql' && format('{0} mariadb', matrix.db-version.mysql) || '' }}
        ${{ matrix.source == 'mongodb' && 'mongodb' || '' }}
        ${{ matrix.source == 'cockroachdb' && 'cockroachdb' || '' }}
      checkout_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      run_label: ${{ matrix.source }}-pg${{ matrix.db-version.pg }}-my${{ matrix.db-version.mysql }}-ma${{ matrix.db-version.mariadb }}-mo${{ matrix.db-version.mongo }}-ch${{ matrix.db-version.ch }}-crdb${{ matrix.db-version.crdb }}
      postgres_image: imresamu/postgis:${{ matrix.db-version.pg }}-3.5-alpine
      mysql_gtid_image: ${{ matrix.version-configs.mysql['mysql-gtid'] }}
      mysql_pos_image: ${{ matrix.version-configs.mysql['mysql-pos'] }}
      mariadb_image: ${{ matrix.version-configs.mariadb[matrix.db-version.mariadb] }}
      mongodb_image: mongo:${{ matrix.db-version.mongo }}
      clickhouse_image: ${{ matrix.version-configs.clickhouse[matrix.db-version.ch] }}
      cockroachdb_image: ${{ matrix.version-configs.cockroachdb[matrix.db-version.crdb] }}
      # Point the tests at this combination's flavors; overrides what they load
      # from .env. The ports must match CI_MYSQL_GTID_PORT/CI_MYSQL_POS_PORT in
      # .env.example (the CI .env is seeded from it).
      test_env: |
        CI_MYSQL_VERSION=${{ matrix.db-version.mysql }}
        CI_MYSQL_PORT=${{ matrix.db-version.mysql == 'mysql-pos' && '3307' || '3306' }}
        CI_MARIADB_VERSION=${{ matrix.db-version.mariadb }}
        FLOW_TESTS_RDS_IAM_AUTH_SKIP=false
    secrets: inherit
