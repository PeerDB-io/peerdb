# Package prefixes include descendants; unassigned packages run in unit.
# Every top-level E2E test must be registered under exactly one source.

# Destination-only packages/suites and shared SSH tests use the Postgres jobs.
postgres:
  packages:
    - connectors/postgres
    - connectors/utils
    - connectors/clickhouse
    - connectors/snowflake
    - pkg/postgres
    - pkg/clickhouse
  e2e:
    - TestApiPg
    - TestClickHouseTLSDirectory
    - TestGenericBQ
    - TestGenericCH_PG
    - TestGenericChCluster_PG
    - TestGenericPG
    - TestGenericSF
    - TestPeerFlowE2ETestSuiteBQ
    - TestPeerFlowE2ETestSuiteGCS
    - TestPeerFlowE2ETestSuiteMinIO
    - TestPeerFlowE2ETestSuitePG
    - TestPeerFlowE2ETestSuitePG_CH
    - TestPeerFlowE2ETestSuitePG_CH_Cluster
    - TestPeerFlowE2ETestSuiteS3
    - TestPeerFlowE2ETestSuiteSF
    - TestSnowflakeSchemaDeltaTestSuite
    - TestSwitchboardPostgres
    - Test_Eventhubs
    - Test_PubSub

mysql:
  packages:
    - connectors/mysql
    - pkg/mysql
  e2e:
    - TestApiMariaDB
    - TestApiMy
    - TestGenericCH_MariaDB
    - TestGenericCH_MySQL
    - TestGenericChCluster_MariaDB
    - TestGenericChCluster_MySQL
    - TestMySQLRDSBinlog
    - TestPeerFlowE2ETestSuiteMariaDB_CH
    - TestPeerFlowE2ETestSuiteMariaDB_CH_Cluster
    - TestPeerFlowE2ETestSuiteMySQL_CH
    - TestPeerFlowE2ETestSuiteMySQL_CH_Cluster
    - TestSwitchboardMariaDB
    - TestSwitchboardMySQL

mongodb:
  packages:
    - connectors/mongo
    - pkg/mongo
  e2e:
    - TestApiMongo
    - TestMongoClickhouseSuite
    - TestSwitchboardMongo

cockroachdb:
  packages:
    - connectors/cockroachdb
  e2e:
    - TestCockroachDBClickHouseSuite
    - TestCockroachDBSuite

# Postgres-to-BigQuery E2E suites belong to Postgres; these exercise the source.
bigquery:
  packages:
    - connectors/bigquery
    - pkg/bigquery
  e2e:
    - TestBigQueryClickhouseSuite
