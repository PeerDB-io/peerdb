[advisories]
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; pgwire, pbjson-types and x509-certificate still require it" },
  { id = "RUSTSEC-2023-0071", reason = "no fixed rsa 0.9 release; resolved by the rsa 0.10 upgrade" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
