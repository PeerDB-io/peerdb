SPECIFICATION Spec
CONSTANTS Destination="PostgreSQL" Batches=3 Limit=2 MaxFailures=1 MaxRestarts=1 Tables={a,b}
INVARIANTS NoSkippedAcknowledgment ProgressOrdered CompletionBeforeNotification NoStrandedNormalize NoStrandedSync
PROPERTIES BoundaryExact FailureDoesNotAcknowledge RetryUsesLatest TargetsDoNotAcknowledge MonotoneWithinAttempt AllPublishedComplete ShutdownCompletes

INVARIANTS OnlyReadyWork OnlyCatalogReadyWork OnlyDestinationReadyWork SavedCheckpointIsReady SavedCheckpointHasRaw CatalogFollowsDestination
PROPERTY SyncFailureDoesNotPublish

CONSTANTS GroupBatches=4 Workers={w1}
PROPERTIES PostgresReportsWholeCall ReportMatchesCallBoundary NoPublicationDuringInternalCommit
INVARIANT PostgresEffectsAndCheckpointAtomic
CONSTANT PrimaryWorker=w1

CONSTANT MaxSyncFailures=1
INVARIANTS ReturnedActivityHasNoNormalizer NoSyncDuringJoin
PROPERTIES SyncErrorsLeaveActivity RestartSeedsDurableProgress RestartRequiresNormalizerExit SyncErrorEventuallyReturns
INVARIANTS ReadyCompletionCanPublish ReadySyncCanPublish
PROPERTIES ParentCancelPreservesProgress JoinedShutdownIsFinal

INVARIANT AcknowledgmentRequiresReadySync
PROPERTIES AcknowledgmentWithinTarget BackpressureStopsFurtherPulls DurableProgressMonotone DurableWriteArgumentsOrdered

INVARIANTS SavedCheckpointHasCatalogSchema SavedCheckpointHasDestinationSchema
